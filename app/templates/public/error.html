{% extends "base.html" %}

{% block title %}Page Not Found ({{ error_code }}) | {{ brand_name }}{% endblock %}

{% block content %}
<section class="py-5 text-center my-auto">
  <div class="container py-5">
    <div class="max-w-700 mx-auto bg-white p-5 rounded-4 border border-subtle shadow-sm">
      <div class="font-heading display-1 fw-extrabold text-warning mb-2">{{ error_code }}</div>
      <h3 class="fw-bold font-heading text-charcoal mb-3">Notice</h3>
      <p class="text-muted mb-4 fs-6">{{ message }}</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('public.index') }}" class="btn btn-gold">
          <i class="bi bi-house"></i> Return Home
        </a>
        <a href="{{ url_for('public.catalogue') }}" class="btn btn-outline-dark">
          <i class="bi bi-grid"></i> Browse Catalogue
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
